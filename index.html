
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MFP Gift Drop Dashboard</title>
  <style>
    body {
      font: 16px system-ui, sans-serif;
      background: #0b0b0d;
      color: #f5f5f5;
      max-width: 760px;
      margin: 32px auto;
      padding: 16px;
    }
    h1 { font-size: 26px; }
    textarea, button {
      font: inherit;
      border-radius: 9px;
      padding: 12px;
    }
    textarea {
      box-sizing: border-box;
      width: 100%;
      min-height: 180px;
      color: white;
      background: #17171b;
      border: 1px solid #393940;
    }
    button, a {
      cursor: pointer;
    }
    button {
      background: #fecc58;
      color: #111;
      border: 0;
      font-weight: 650;
      margin: 8px 5px 8px 0;
    }
    .item {
      border: 1px solid #34343b;
      background: #151519;
      border-radius: 12px;
      padding: 14px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }
    .code { font-family: monospace; }
    .muted { color: #aaa; font-size: 14px; }
    .warning { color: #ffcf75; }
    a { color: #fecc58; }
  </style>
</head>
<body>
  <h1>MFP Gift Drop Dashboard</h1>
  <p class="muted">
    Paste Discord drop messages below. Codes are processed locally
    in this browser. Verify corrections before redeeming.
  </p>

  <textarea id="messages"
    placeholder="Paste the Discord messages here..."></textarea>
  <br>
  <button id="scan">Extract gift codes</button>
  <button id="clear">Clear input</button>
  <p id="status" aria-live="polite"></p>
  <div id="results"></div>

  <p>
    <a href="https://myfundedperpetuals.com/rewards/redeem"
       target="_blank" rel="noopener noreferrer">
      Open MyFundedPerps redemption page ↗
    </a>
  </p>

<script>
  const input = document.getElementById("messages");
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  // Remembers processed codes only for this open page.
  const seen = new Set();

  document.getElementById("scan").addEventListener("click", () => {
    const text = input.value;
    const matches = [...text.matchAll(/mfp_gift_[A-Za-z0-9]+/g)];
    const unique = [...new Set(matches.map(m => m[0]))];

    results.replaceChildren();

    if (!unique.length) {
      status.textContent = "No gift codes found. Paste the original messages.";
      return;
    }

    const correctionMentioned =
      /missing from (?:the )?end|wasn't missing|wasnt missing|correction/i
        .test(text);

    let added = 0;

    unique.forEach(code => {
      if (seen.has(code)) return;
      seen.add(code);
      added++;

      const card = document.createElement("section");
      card.className = "item";

      const codeLine = document.createElement("p");
      codeLine.className = "code";
      codeLine.textContent = code;

      const note = document.createElement("p");
      note.className = "muted";
      note.textContent = correctionMentioned
        ? "A correction appears in the pasted text. Verify this code against the original messages."
        : "Candidate found. Verify it against the original Discord message.";

      const copy = document.createElement("button");
      copy.textContent = "Copy code";
      copy.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(code);
          status.textContent = "Code copied.";
        } catch {
          status.textContent = "Clipboard unavailable. Select and copy the code.";
        }
      });

      const open = document.createElement("button");
      open.textContent = "Open redeem page";
      open.addEventListener("click", () => {
        window.open(
          "https://myfundedperpetuals.com/rewards/redeem",
          "_blank",
          "noopener,noreferrer"
        );
      });

      card.append(codeLine, note, copy, open);
      results.append(card);
    });

    status.textContent = added
      ? `Added ${added} new code candidate(s).`
      : "These codes have already been processed in this session.";
  });

  document.getElementById("clear").addEventListener("click", () => {
    input.value = "";
    status.textContent = "";
    results.replaceChildren();
  });
</script>
</body>
</html>
